<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RACK">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>RACK</title>
<style>
:root{
  --ink:#000; --paper:#fff; --field:#F1F2F4; --line:#DCDEE2; --mute:#666B72;
  --red:#D50032; --blue:#0047AB; --yellow:#F2C200; --green:#00863F;
  --pad:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:calc(72px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hide{display:none!important}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 10px;display:flex;align-items:baseline;gap:10px}
.brand{font-weight:900;font-size:19px;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--red)}
.hdate{margin-left:auto;font-size:12px;color:var(--mute)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--paper);border-top:2px solid var(--ink);padding-bottom:var(--safe-b)}
nav button{padding:11px 0 10px;font-size:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:17px;font-weight:800;letter-spacing:-.02em}
nav button.on{color:var(--ink)} nav button.on b{color:var(--red)}

main{padding:var(--pad) var(--pad) 28px;max-width:680px;margin:0 auto}
h2{font-size:12px;font-weight:700;margin:24px 0 8px;color:var(--mute);letter-spacing:.02em}
h2:first-child{margin-top:2px}

.card{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:10px;overflow:hidden}
.card.hero{border:2px solid var(--ink)}
.pad{padding:14px}
.ttl{font-weight:800;font-size:17px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--mute);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);
  border-radius:9px;padding:11px 14px;font-weight:700;font-size:14px;background:var(--paper)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--mute);font-weight:600}
.btn.wide{width:100%}
.btn.big{padding:17px 0;font-size:17px;font-weight:800;border-radius:11px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)} .small{font-size:12px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;color:var(--mute);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.bar{height:6px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--red)}

input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--field);border:1px solid transparent;border-radius:9px;padding:11px 10px;
  font-size:16px;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--ink);background:var(--paper)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
label.f{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}

/* stepper */
.stp{display:flex;align-items:center;background:var(--field);border-radius:10px;overflow:hidden}
.stp button{width:42px;height:44px;font-size:20px;font-weight:700;color:var(--mute);flex:0 0 auto}
.stp button:active{background:var(--line)}
.stp input{background:none;border:0;text-align:center;font-weight:800;font-size:17px;padding:0;min-width:0}
.stp.lg button{width:50px;height:54px;font-size:24px}
.stp.lg input{font-size:22px}

/* session */
.exhd{display:flex;align-items:center;gap:8px;padding:13px 14px 4px}
.exhd .nm{font-weight:800;font-size:16px}
.exhd .tag{font-size:11px;color:var(--mute);margin-left:auto;text-align:right;line-height:1.3}
.sets{padding:6px 10px 12px}
.st{display:grid;grid-template-columns:18px 1fr 1fr 50px;gap:6px;align-items:center;margin-bottom:8px}
.st .stp button{width:32px;height:44px;font-size:18px}
.st .stp input{font-size:16px}
.st .idx{font-size:12px;color:var(--mute);font-weight:700;text-align:center}
.st .chk{height:44px;border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:19px;color:#C9CCD1;font-weight:800}
.st.done .chk{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.st.done .stp{opacity:.5}
.st .u{font-size:10px;color:var(--mute);text-align:center;margin-top:-4px}
.sthead{display:grid;grid-template-columns:18px 1fr 1fr 50px;gap:6px;padding:0 10px 4px;font-size:10px;color:var(--mute);text-align:center}
.goal{padding:0 14px 10px;font-size:11.5px;color:var(--mute)}
.stickybar{position:fixed;left:0;right:0;bottom:calc(72px + var(--safe-b));z-index:38;transition:bottom .2s;
  padding:9px var(--pad);background:var(--paper);border-top:1px solid var(--line);display:flex;gap:8px;max-width:680px;margin:0 auto}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--mute)}
.chip.on{border-color:var(--ink);color:var(--ink)}

/* timer bar */
#tbar{position:fixed;left:0;right:0;bottom:calc(72px + var(--safe-b));z-index:46;display:none;
  background:var(--ink);color:var(--paper);padding:10px 14px;align-items:center;gap:10px}
#tbar.on{display:flex}
body.tmr .stickybar{bottom:calc(126px + var(--safe-b))}
#tbar .t{font-size:25px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:74px}
#tbar button{color:var(--paper);border:1.5px solid rgba(255,255,255,.45);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
#tbar .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--red);transition:width .3s linear}

/* focus */
#focus{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(var(--safe-b) + 12px)}
#focus.on{display:flex}
.fxtop{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.fxex{font-size:25px;font-weight:900;letter-spacing:-.03em;margin-top:10px;line-height:1.15}
.fxset{font-size:13px;color:var(--mute);margin-top:2px}
.fxkg{font-size:74px;font-weight:900;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}
.fxkg small{font-size:22px;font-weight:800;letter-spacing:0;margin-left:3px}
.plates{display:flex;gap:3px;align-items:center;height:42px;margin-top:8px;flex-wrap:wrap}
.plate{width:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.plates .barline{flex:0 0 20px;height:5px;background:#9AA0A6;border-radius:2px}
.plates .txt{font-size:11px;color:var(--mute);margin-left:6px}
.fxmid{margin:auto 0}
.fxin .lb{font-size:11px;color:var(--mute);text-align:center;margin-bottom:4px}
.fxrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fxbtn{display:grid;grid-template-columns:1fr 2.2fr;gap:8px;margin-top:10px}
.fxbtn .btn{padding:17px 0;font-size:16px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .inner{background:var(--paper);width:100%;max-height:92vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;max-width:680px;margin:0 auto}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet .sh b{font-size:16px;font-weight:800;flex:1}
#sheet .sc{overflow:auto;padding:14px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}

.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:13px 13px;margin-bottom:8px}
.li .nm{font-weight:700} .li .mt{font-size:12px;color:var(--mute)}
.li .go{margin-left:auto;color:#B9BEC4;font-size:19px}
.mi{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.mi .top{display:flex;align-items:center;gap:8px}
.gset{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:9px;padding:9px 11px;margin-top:8px;font-weight:700}
.gset .x{margin-left:auto;color:var(--mute);font-weight:400;font-size:19px}

table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td{padding:4px 0;border-bottom:1px solid var(--field)}
table.log td:last-child{text-align:right;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:80;
  background:var(--ink);color:var(--paper);padding:11px 17px;border-radius:99px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}

/* manual */
.man h3{font-size:16px;font-weight:800;margin:26px 0 6px;padding-top:4px}
.man h3:first-child{margin-top:0}
.man p{margin:6px 0;font-size:14px}
.man ol{padding-left:1.2em;margin:8px 0}
.man ol li{margin-bottom:7px;font-size:14px}
.man .shot{display:block;width:100%;max-width:300px;margin:10px auto;border:1px solid var(--line);border-radius:12px}
.man .note{background:var(--field);border-radius:10px;padding:11px 12px;font-size:13px;margin:10px 0}
.man .note b{display:block;margin-bottom:3px}
.man kbd{background:var(--ink);color:var(--paper);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700}

/* tour */
#tour{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px}
#tour.on{display:flex}
#tour .box{background:var(--paper);border-radius:16px;padding:22px 20px;max-width:340px;width:100%}
#tour h4{margin:0 0 8px;font-size:19px;font-weight:900;letter-spacing:-.02em}
#tour p{margin:0 0 14px;font-size:14px;color:#333}
#tour .dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
#tour .dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
#tour .dots i.on{background:var(--ink)}
</style>
</head>
<body>
<header><div class="brand">RACK<em>.</em></div><div class="hdate" id="hdate"></div>
<button class="btn sm ghost" style="margin-left:10px;padding:6px 11px" data-act="timer">タイマー</button></header>
<main id="main"></main>

<div id="tbar">
  <div class="t num" id="tval">0:00</div>
  <button data-act="tadj" data-v="-30">−30</button>
  <button data-act="tadj" data-v="30">+30</button>
  <div class="grow"></div>
  <button data-act="tstop">終了</button>
  <div class="pg" id="tpg"></div>
</div>

<nav>
  <button data-tab="today" class="on"><b>今日</b><span>トレーニング</span></button>
  <button data-tab="build"><b>組む</b><span>メニュー</span></button>
  <button data-tab="log"><b>記録</b><span>履歴</span></button>
  <button data-tab="set"><b>設定</b><span>使い方・1RM</span></button>
</nav>

<div id="focus">
  <div class="fxtop"><button class="btn sm ghost" data-act="fxclose">閉じる</button><span id="fxProg"></span></div>
  <div class="fxex" id="fxEx"></div>
  <div class="fxset" id="fxSet"></div>
  <div class="fxmid">
    <div class="fxkg num" id="fxKg">—<small>kg</small></div>
    <div class="plates" id="fxPlates"></div>
  </div>
  <div class="fxin">
    <div class="lb">重量 kg</div>
    <div class="stp lg"><button data-act="fxn" data-f="kg" data-v="-1">−</button>
      <input class="grow num" type="number" inputmode="decimal" id="fxKgI"><button data-act="fxn" data-f="kg" data-v="1">＋</button></div>
    <div class="fxrow2">
      <div><div class="lb">回数</div><div class="stp lg"><button data-act="fxn" data-f="reps" data-v="-1">−</button>
        <input class="grow num" type="number" inputmode="numeric" id="fxRepI"><button data-act="fxn" data-f="reps" data-v="1">＋</button></div></div>
      <div><div class="lb">RPE</div><div class="stp lg"><button data-act="fxn" data-f="rpe" data-v="-1">−</button>
        <input class="grow num" type="number" inputmode="decimal" id="fxRpeI"><button data-act="fxn" data-f="rpe" data-v="1">＋</button></div></div>
    </div>
  </div>
  <div class="fxbtn">
    <button class="btn" data-act="fxskip">スキップ</button>
    <button class="btn red" data-act="fxdone">記録して休憩</button>
  </div>
</div>

<div id="sheet"><div class="inner"><div class="sh"><b id="shTtl"></b><button class="btn sm ghost" data-act="shclose">閉じる</button></div><div class="sc" id="shBody"></div></div></div>

<div id="tour"><div class="box">
  <div class="dots" id="tDots"></div>
  <h4 id="tH"></h4><p id="tP"></p>
  <div class="row"><button class="btn ghost grow" data-act="tourskip">とばす</button>
  <button class="btn fill grow" data-act="tournext" id="tNext">次へ</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== RPEチャート ========== */
const RPE={
 10:[100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0],
 9.5:[97.8,94.3,91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7],
 9:[95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3],
 8.5:[94.3,91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0],
 8:[92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6],
 7.5:[91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0,61.3],
 7:[89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6,59.9],
 6.5:[88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0,61.3,58.6],
 6:[86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6,59.9,57.2]};
function rpePct(reps,rpe){
  const r=Math.min(12,Math.max(1,Math.round(reps||1)));
  const ks=Object.keys(RPE).map(Number).sort((a,b)=>a-b);
  let k=ks[ks.length-1]; for(const x of ks){ if(rpe<=x){k=x;break;} } if(rpe<6)k=6;
  return RPE[k][r-1];
}
const e1rm=(kg,reps,rpe)=>(!kg||!reps)?0:kg/(rpePct(reps,rpe||10)/100);
/* 実績セットの推定1RM：入力RPE → 目標RPE → 9 の順で採用 */
const E1=s=>e1rm(+s.kg||0,+s.reps||0,+s.rpe||+s.t||9);

/* ========== 保存 ========== */
const KEY='rack.v1', uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function defaults(){
  const mk=(n,big,rest,bar)=>({id:uid(),name:n,big3:!!big,rest:rest||180,bar:bar!==false});
  const ex=[mk('スクワット',1,240),mk('ベンチプレス',1,240),mk('デッドリフト',1,300),
    mk('インクラインダンベルプレス',0,120,false),mk('ベントオーバーロウ',0,150),mk('ラットプルダウン',0,120,false),
    mk('オーバーヘッドプレス',0,150),mk('レッグプレス',0,150,false),mk('ケーブルロウ',0,120,false),
    mk('トライセプスプレスダウン',0,90,false),mk('フェイスプル',0,90,false),mk('レッグカール',0,90,false)];
  return {v:2,settings:{bar:20,round:2.5,rest:180,scName:'レストタイマー',scAfter:'clock',presets:[90,180,300],step:30},
    oneRM:{[ex[0].id]:130,[ex[1].id]:105,[ex[2].id]:160},
    exercises:ex,menus:[],plans:[],logs:[],active:null,tour:false};
}
let S, TAB='today';
function load(){
  try{ S=JSON.parse(localStorage.getItem(KEY))||defaults(); }catch(e){ S=defaults(); }
  const d=defaults();
  for(const k of ['exercises','menus','plans','logs']) if(!Array.isArray(S[k]))S[k]=[];
  S.settings=Object.assign({},d.settings,S.settings||{});
  if(!Array.isArray(S.settings.presets)||S.settings.presets.length!==3)S.settings.presets=[90,180,300];
  if(!S.oneRM)S.oneRM={};
  migrate();
}
function migrate(){
  if(S.v===2)return;
  // v1: routines / programs → plans, menu.items[].sets → groups
  (S.menus||[]).forEach(m=>m.items.forEach(it=>{
    if(it.groups)return;
    it.groups=[]; (it.sets||[]).forEach(s=>{
      const g=it.groups[it.groups.length-1], key=JSON.stringify([s.mode,s.reps,s.kg,s.pct,s.rpe]);
      if(g&&g._k===key)g.sets++; else it.groups.push({_k:key,sets:1,mode:s.mode||'rpe',reps:s.reps||5,kg:s.kg||0,pct:s.pct||0,rpe:s.rpe||8});
    });
    if(!it.groups.length)it.groups=[{sets:3,mode:'rpe',reps:5,rpe:8}];
    it.groups.forEach(g=>delete g._k); delete it.sets;
  }));
  S.plans=S.plans||[];
  (S.routines||[]).forEach(r=>S.plans.push({id:r.id,name:r.name,days:r.days||[],
    weeks:[{label:'—',scale:100,deload:false}],curW:0,curD:r.cursor||0}));
  (S.programs||[]).forEach(p=>S.plans.push({id:p.id,name:p.name,days:(p.weeks[0]||{days:[]}).days||[],
    weeks:(p.weeks||[]).map(w=>({label:w.label,scale:w.scale==null?100:w.scale,deload:!!w.deload})),
    curW:p.curW||0,curD:p.curD||0}));
  delete S.routines; delete S.programs; S.v=2; save();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('保存できませんでした');} }
const EX=id=>S.exercises.find(e=>e.id===id)||{name:'不明な種目',rest:180,bar:true};
const MENU=id=>S.menus.find(m=>m.id===id);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}
const fmt=n=>(Math.round(n*100)/100).toString();
const roundKg=k=>Math.max(0,Math.round(k/(S.settings.round||2.5))*(S.settings.round||2.5));
const mmss=s=>Math.floor(s/60)+':'+String(Math.max(0,s%60)).padStart(2,'0');
function parseTimeText(t){
  t=String(t||'').replace(/[０-９：]/g,c=>'0123456789:'['０１２３４５６７８９：'.indexOf(c)]);
  if(t.includes(':')){const[a,b]=t.split(':');return (+a||0)*60+(+b||0);}
  const n=+t||0; return n<=20?n*60:n;
}

/* 基準1RM：直近60日のログ優先 */
function baseRM(exId){
  const lim=Date.now()-60*864e5; let best=0;
  S.logs.forEach(l=>{ if(new Date(l.date).getTime()<lim)return;
    l.items.forEach(it=>{ if(it.exId!==exId)return;
      it.sets.forEach(s=>{ if(s.kg&&s.reps)best=Math.max(best,E1(s)); }); }); });
  return best||S.oneRM[exId]||0;
}
function gTarget(g,exId,scale){
  const sc=(scale==null?100:scale)/100;
  if(g.mode==='kg')return g.kg?roundKg(g.kg*sc):0;
  const b=baseRM(exId); if(!b)return 0;
  if(g.mode==='pct')return roundKg(b*(g.pct||0)/100*sc);
  return roundKg(b*rpePct(g.reps,g.rpe||8)/100*sc);
}
const gLabel=g=>g.sets+'セット × '+(g.reps||'?')+'回 '+(g.mode==='kg'?(g.kg||0)+'kg':g.mode==='pct'?(g.pct||0)+'%':'RPE'+(g.rpe||8));
function lastKg(exId){
  const ls=S.logs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const l of ls){ const it=l.items.find(x=>x.exId===exId);
    if(it&&it.sets.length) return Math.max.apply(null,it.sets.map(s=>+s.kg||0)); }
  return 0;
}
function lastLog(exId){
  const ls=S.logs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const l of ls){ const it=l.items.find(x=>x.exId===exId); if(it&&it.sets.length){
    const b=it.sets.reduce((p,c)=>(c.kg*c.reps>p.kg*p.reps?c:p),it.sets[0]);
    return l.date.slice(5)+' '+fmt(b.kg)+'kg×'+b.reps; } }
  return '';
}

function chart(exId){
  const pts=[];
  S.logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    let b=0; l.items.filter(i=>i.exId===exId).forEach(i=>i.sets.forEach(s=>{if(s.kg&&s.reps)b=Math.max(b,E1(s));}));
    if(b)pts.push({d:l.date,v:b});
  });
  if(!pts.length)return '<div class="mute small">この種目の記録はまだありません。</div>';
  const W=320,H=130,P=22, vs=pts.map(p=>p.v), mn=Math.min(...vs)*.96, mx=Math.max(...vs)*1.04, rg=(mx-mn)||1;
  const X=i=>pts.length===1?W/2:P+i*(W-P*2)/(pts.length-1), Y=v=>H-P-(v-mn)/rg*(H-P*2);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const f=pts[0],l=pts[pts.length-1];
  return '<div class="row" style="align-items:baseline;gap:8px"><div class="num" style="font-size:31px;font-weight:900;letter-spacing:-.04em">'+
    fmt(Math.round(l.v*10)/10)+'<span style="font-size:14px"> kg</span></div><div class="small mute">推定1RM'+
    (pts.length>1?'　'+(l.v>=f.v?'+':'')+fmt(Math.round((l.v-f.v)*10)/10)+'kg':'')+'</div></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" preserveAspectRatio="none">'+
    '<path d="'+line+'" fill="none" stroke="#000" stroke-width="2"/>'+
    pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="#D50032"/>').join('')+'</svg>'+
    '<div class="row small mute"><span>'+f.d.slice(5)+'</span><div class="grow"></div><span>'+l.d.slice(5)+'</span></div>';
}

/* ========== セッション ========== */
function startSession(menuObj,scale,title,src){
  const items=menuObj.items.map(it=>{
    const sets=[];
    (it.groups||[]).forEach(g=>{ const tk=gTarget(g,it.exId,scale)||lastKg(it.exId);
      for(let n=0;n<(g.sets||1);n++) sets.push({kg:tk||'',reps:g.reps||'',rpe:'',trpe:g.mode==='rpe'?(g.rpe||''):'',done:false});
    });
    return {exId:it.exId,rest:it.rest||EX(it.exId).rest||S.settings.rest,
      goal:(it.groups||[]).map(g=>gLabel(g)).join(' / '),sets:sets};
  });
  S.active={date:todayStr(),title:title,source:src||null,items:items};
  save();render();
}
function finish(){
  const a=S.active;
  const items=a.items.map(it=>({exId:it.exId,name:EX(it.exId).name,
    sets:it.sets.filter(s=>s.done).map(s=>({kg:+s.kg||0,reps:+s.reps||0,rpe:+s.rpe||0,t:+s.trpe||0}))})).filter(i=>i.sets.length);
  if(!items.length){ if(!confirm('完了したセットがありません。破棄しますか？'))return; S.active=null;save();render();return; }
  let vol=0; items.forEach(i=>i.sets.forEach(s=>vol+=s.kg*s.reps));
  S.logs.push({id:uid(),date:a.date,title:a.title,items:items,volume:vol});
  if(a.source){ const p=S.plans.find(x=>x.id===a.source); if(p)advance(p); }
  S.active=null;save();TAB='log';render();toast('記録しました');
}
function advance(p){
  let d=(p.curD||0)+1, w=p.curW||0;
  if(d>=p.days.length){ d=0; w=(w+1)%p.weeks.length; }
  p.curD=d;p.curW=w;save();
}

/* ========== タイマー（ショートカット） ========== */
let T={end:0,total:0,h:null};
function runShortcut(sec){
  const name=(S.settings.scName||'レストタイマー').trim();
  let url='shortcuts://x-callback-url/run-shortcut?name='+encodeURIComponent(name)+'&input=text&text='+sec;
  if(S.settings.scAfter==='clock')     url+='&x-success='+encodeURIComponent('clock-timer://');
  else if(S.settings.scAfter==='back') url+='&x-success='+encodeURIComponent(location.href);
  try{ window.location.href=url; }catch(e){ toast('ショートカットを起動できませんでした'); }
}
function startRest(sec){
  sec=Math.max(5,Math.round(sec||S.settings.rest));
  runShortcut(sec);
  T.end=Date.now()+sec*1000;T.total=sec;$('#tbar').classList.add('on');document.body.classList.add('tmr');
  clearInterval(T.h);T.h=setInterval(tick,250);tick();
}
function stopRest(){clearInterval(T.h);T.h=null;$('#tbar').classList.remove('on');document.body.classList.remove('tmr');}
function tick(){
  const left=Math.max(0,Math.round((T.end-Date.now())/1000));
  $('#tval').textContent=mmss(left);
  $('#tpg').style.width=(T.total?(1-left/T.total)*100:0)+'%';
  if(left<=0){ clearInterval(T.h);T.h=null; setTimeout(stopRest,4000); }
}

let FX={i:0,j:0};
function openFocus(){
  const p=next(0,-1); if(!p){toast('全セット完了しています');return;}
  FX=p;$('#focus').classList.add('on');drawFX();
}
function next(i,j){
  const a=S.active;
  for(let x=i;x<a.items.length;x++)for(let y=(x===i?j+1:0);y<a.items[x].sets.length;y++) if(!a.items[x].sets[y].done)return{i:x,j:y};
  return null;
}
function drawFX(){
  const a=S.active,it=a.items[FX.i],s=it.sets[FX.j],e=EX(it.exId);
  let n=0,d=0;a.items.forEach(x=>x.sets.forEach(y=>{n++;if(y.done)d++;}));
  $('#fxProg').textContent=a.title+'　'+d+'/'+n;
  $('#fxEx').textContent=e.name;
  $('#fxSet').textContent='セット '+(FX.j+1)+' / '+it.sets.length+(it.goal?'　'+it.goal:'');
  $('#fxKgI').value=s.kg||''; $('#fxRepI').value=s.reps||''; $('#fxRpeI').value=s.rpe||s.trpe||'';
  paintFX();
}
function paintFX(){
  const kg=+$('#fxKgI').value||0, it=S.active.items[FX.i];
  $('#fxKg').innerHTML=(kg?fmt(kg):'—')+'<small>kg</small>';
  $('#fxPlates').innerHTML=EX(it.exId).bar?plates(kg):'';

const PL=[[25,'#D50032'],[20,'#0047AB'],[15,'#F2C200'],[10,'#00863F'],[5,'#FFFFFF'],[2.5,'#111'],[1.25,'#B9BEC4']];
function plates(kg){
  const bar=S.settings.bar||20;
  if(!kg||kg<=bar)return '<div class="barline"></div><span class="txt">バーのみ</span>';
  let per=(kg-bar)/2,list=[];
  PL.forEach(([w,c])=>{ while(per>=w-0.001){per-=w;list.push([w,c]);} });
  return '<div class="barline"></div>'+list.map(([w,c])=>'<div class="plate" style="height:'+(26+w*.7)+'px;background:'+c+'"></div>').join('')+
    '<span class="txt">片側 '+list.map(x=>x[0]).join('+')+(per>.01?'（+'+fmt(per)+'余り）':'')+'</span>';
}
function fxDone(skip){
  const it=S.active.items[FX.i],s=it.sets[FX.j];
  if(!skip){
    s.kg=+$('#fxKgI').value||0;s.reps=+$('#fxRepI').value||0;s.rpe=+$('#fxRpeI').value||'';
    s.done=true;save();startRest(it.rest);
  }
  const nx=next(FX.i,FX.j);
  if(!nx){$('#focus').classList.remove('on');render();toast('全セット完了');return;}
  FX=nx;drawFX();
}

function pickEx(cb,multi){

document.addEventListener('click',ev=>{
  const nv=ev.target.closest('nav button'); if(nv){TAB=nv.dataset.tab;render();return;}
  const t=ev.target.closest('[data-act]'); if(t){ act(t,ev); return; }
  const g=ev.target.closest('[data-g]'); if(g){ grp(g); return; }
  const m=ev.target.closest('[data-man]'); if(m){ manual(m.dataset.man); return; }
  const e2=ev.target.closest('[data-ed]'); if(e2){ med(e2); return; }
  const p=ev.target.closest('[data-pl]'); if(p){ pld(p); return; }
  if(ev.target.id==='sheet')closeSheet();

function act(t,ev){
  const a=t.dataset.act,id=t.dataset.id,i=+t.dataset.i;
  if(a==='pick'){
    if(!S.menus.length){toast('先にメニューを作ってください');TAB='build';render();return;}
    sheet('メニューを選ぶ',S.menus.map(m=>'<div class="li" data-act="startmenu" data-id="'+m.id+'"><div><div class="nm">'+esc(m.name)+'</div>'+
      '<div class="mt">'+m.items.map(x=>EX(x.exId).name).slice(0,3).join('・')+'</div></div><div class="go">›</div></div>').join(''));return; }
  if(a==='startmenu'){ const m=MENU(id);closeSheet();startSession(m,100,m.name,null);return; }
  if(a==='start'){ const p=S.plans.find(x=>x.id===id),n=planNext(p);
    if(!n||!n.menu){toast('この日にメニューが設定されていません');return;}
    const sc=n.w.deload?Math.min(n.w.scale||100,90):(n.w.scale||100);
    startSession(n.menu,sc,(p.weeks.length>1?n.w.label+' ':'')+n.d.label+'　'+n.menu.name,p.id);return; }
  if(a==='skipday'){ const p=S.plans.find(x=>x.id===id);advance(p);render();return; }
  if(a==='chk'){ const r=t.closest('.st'),it=S.active.items[+r.dataset.i],s=it.sets[+r.dataset.j];
    s.done=!s.done;
    if(s.done){ const ip=r.querySelectorAll('input'); s.kg=+ip[0].value||0;s.reps=+ip[1].value||0; save();render();startRest(it.rest); }
    else {save();render();} return; }
  if(a==='nudge'){ const r=t.closest('.st'),s=S.active.items[+r.dataset.i].sets[+r.dataset.j],f=t.dataset.f;
    const inp=r.querySelector('input[data-f="'+f+'"]');
    const stp=f==='kg'?(S.settings.round||2.5):1;
    let v=(+inp.value||0)+(+t.dataset.v)*stp; if(v<0)v=0;
    inp.value=v?fmt(v):''; s[f]=v; save(); return; }
  if(a==='addset'){ const it=S.active.items[i],l=it.sets[it.sets.length-1]||{};
    it.sets.push({kg:l.kg||'',reps:l.reps||'',rpe:'',trpe:l.trpe||'',done:false});save();render();return; }
  if(a==='rmex'){ S.active.items.splice(i,1);save();render();return; }
  if(a==='addex'){ pickEx(ids=>{ (Array.isArray(ids)?ids:[ids]).forEach(x=>S.active.items.push(
      {exId:x,rest:EX(x).rest,goal:'自由',sets:[{kg:'',reps:'',rpe:'',done:false}]})); save();render(); },true);return; }
  if(a==='focus'){ openFocus();return; }
  if(a==='finish'){ finish();return; }
  if(a==='cancel'){ if(confirm('このセッションを破棄しますか？')){S.active=null;save();render();} return; }
  if(a==='fxclose'){ $('#focus').classList.remove('on');render();return; }
  if(a==='fxdone'){ fxDone(false);return; }
  if(a==='fxskip'){ fxDone(true);return; }
  if(a==='fxn'){ const f=t.dataset.f,map={kg:'#fxKgI',reps:'#fxRepI',rpe:'#fxRpeI'},inp=$(map[f]);
    const stp=f==='kg'?(S.settings.round||2.5):f==='rpe'?0.5:1;
    let v=(+inp.value||0)+(+t.dataset.v)*stp; if(v<0)v=0; inp.value=v?fmt(v):''; paintFX(); return; }
  if(a==='timer'){ timerPanel();return; }
  if(a==='tpre'){ TB=+t.dataset.v;timerPanel();return; }
  if(a==='tbn'){ TB=Math.max(5,TB+(+t.dataset.v)*(S.settings.step||30));timerPanel();return; }
  if(a==='tgo'){ if(T.h){stopRest();}else{startRest(TB);} closeSheet();return; }
  if(a==='tadj'){ T.end+=(+t.dataset.v)*1000;T.total+=(+t.dataset.v);tick();return; }
  if(a==='tstop'){ stopRest();return; }
  if(a==='testsc'){ startRest(90);toast('90秒のタイマーを起動しました');return; }
  if(a==='manual'){ manual(t.dataset.sec);return; }
  if(a==='tourskip'){ $('#tour').classList.remove('on');S.tour=true;save();return; }
  if(a==='tournext'){ if(TI<TOUR.length-1){TI++;drawTour();} else {$('#tour').classList.remove('on');S.tour=true;save();manual();} return; }
  if(a==='newmenu'){ editMenu(null);return; }
  if(a==='editmenu'){ editMenu(id);return; }
  if(a==='newplan'){ if(!S.menus.length){toast('先にメニューを作ってください');return;} editPlan(null);return; }
  if(a==='editplan'){ editPlan(id);return; }
  if(a==='shclose'){ closeSheet();return; }
  if(a==='chart'){ S.chartEx=id;save();render();return; }
  if(a==='openlog'){ const l=S.logs.find(x=>x.id===id);
    sheet(l.title,'<div class="small mute">'+l.date+'</div>'+l.items.map(it=>'<h2>'+esc(it.name)+'</h2><table class="log">'+
      it.sets.map((s,n)=>'<tr><td>'+(n+1)+'</td><td>'+fmt(s.kg)+'kg × '+s.reps+(s.rpe?' @'+s.rpe:'')+'</td><td>'+
      fmt(Math.round(E1(s)*10)/10)+'kg</td></tr>').join('')+'</table>').join('')+
      '<button class="btn wide ghost" style="margin-top:18px" data-act="dellog" data-id="'+l.id+'">この記録を削除</button>');return; }
  if(a==='dellog'){ if(confirm('削除しますか？')){S.logs=S.logs.filter(x=>x.id!==id);save();closeSheet();render();} return; }
  if(a==='rmall'){ sheet('基準1RM',S.exercises.map(e=>'<label class="f">'+esc(e.name)+'</label>'+
    '<input type="number" step="2.5" data-rm="'+e.id+'" value="'+(S.oneRM[e.id]||'')+'">').join(''));return; }
  if(a==='newex'||a==='editex'){
    const e=id?S.exercises.find(x=>x.id===id):{id:uid(),name:'',rest:S.settings.rest,bar:true,big3:false,_new:true};
    sheet(id?'種目を編集':'種目を追加',
      '<label class="f">種目名</label><input type="text" id="exN" value="'+esc(e.name)+'">'+
      '<label class="f">休憩 秒</label><input type="number" id="exR" value="'+e.rest+'">'+
      '<label class="f"><input type="checkbox" id="exB" '+(e.bar?'checked':'')+' style="width:auto"> バーベル種目（プレート計算する）</label>'+
      '<label class="f"><input type="checkbox" id="exG" '+(e.big3?'checked':'')+' style="width:auto"> BIG3として扱う</label>'+
      '<button class="btn wide fill" style="margin-top:14px" id="exS">保存</button>'+
      (id?'<button class="btn wide ghost" style="margin-top:8px" id="exD">削除</button>':''),()=>{
        $('#exS').onclick=()=>{ e.name=$('#exN').value.trim()||'無名の種目';e.rest=+$('#exR').value||180;
          e.bar=$('#exB').checked;e.big3=$('#exG').checked;
          if(e._new){delete e._new;S.exercises.push(e);} save();closeSheet();render(); };
        if(id)$('#exD').onclick=()=>{ if(confirm('削除しますか？（過去の記録は残ります）')){S.exercises=S.exercises.filter(x=>x.id!==id);save();closeSheet();render();} };
      });return; }
  if(a==='export'){ const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
    l.href=u;l.download='rack-'+todayStr()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('書き出しました');return; }
  if(a==='import'){ const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.exercises)throw 0;
        if(confirm('現在のデータを置き換えます。よろしいですか？')){S=d;load2(d);save();render();toast('読み込みました');}}catch(e){toast('読み込めませんでした');}};
      r.readAsText(f);};inp.click();return; }
  if(a==='wipe'){ if(confirm('全データを削除します。')&&confirm('本当に削除しますか？')){localStorage.removeItem(KEY);load();render();toast('削除しました');} return; }
}
function load2(d){ S=d; const dd=defaults(); S.settings=Object.assign({},dd.settings,S.settings||{}); migrate(); }
function grp(t){
  const G=ED._g; if(!G)return;
  const k=t.dataset.g;
  const read=()=>{ document.querySelectorAll('[data-g="v"]').forEach(i=>{ G.g[i.dataset.f]=+i.value||0; }); };
  if(k==='n'){ read(); const f=t.dataset.f, st=f==='rpe'?0.5:f==='pct'?2.5:f==='kg'?2.5:1;
    G.g[f]=Math.max(f==='sets'||f==='reps'?1:0,(+G.g[f]||0)+(+t.dataset.v)*st); G.redraw(); return; }
  if(k==='mode'){ read(); G.g.mode=t.dataset.v; G.redraw(); return; }
  if(k==='ok'){ read();
    const it=ED.items[G.i];
    if(G.j==null)it.groups.push(G.g); else it.groups[G.j]=G.g;
    ED._g=null; drawMenu(); return; }
}
function med(t){
  const k=t.dataset.ed, row=t.closest('[data-i]'), i=row?+row.dataset.i:+t.dataset.i, j=row&&row.dataset.j!=null?+row.dataset.j:null;
  const nm=$('#shBody').querySelector('[data-ed="name"]'); if(nm)ED.name=nm.value;
  if(k==='addex'){ pickEx(ids=>{ (Array.isArray(ids)?ids:[ids]).forEach(x=>ED.items.push(
      {exId:x,rest:EX(x).rest,groups:[{sets:3,mode:'rpe',reps:5,rpe:8}]})); drawMenu(); },true);return; }
  if(k==='rmex'){ ED.items.splice(i,1);drawMenu();return; }
  if(k==='addg'){ editGroup(i,null);return; }
  if(k==='editg'){ editGroup(i,j);return; }
  if(k==='rmg'){ const it=ED.items[i]; it.groups.splice(j,1); if(!it.groups.length)it.groups.push({sets:3,mode:'rpe',reps:5,rpe:8}); drawMenu();return; }
  if(k==='rest'){ const v=prompt('休憩の秒数',ED.items[i].rest||180); if(v!=null){ED.items[i].rest=+v||180;drawMenu();} return; }
  if(k==='save'){ if(!ED.name)ED.name='無題のメニュー';
    if(!ED.items.length){toast('種目を追加してください');return;}
    const nw=ED._new;delete ED._new;
    if(nw)S.menus.push(ED); else S.menus=S.menus.map(m=>m.id===ED.id?ED:m);
    save();closeSheet();TAB='build';render();toast('保存しました');return; }
  if(k==='del'){ if(confirm('このメニューを削除しますか？')){S.menus=S.menus.filter(m=>m.id!==ED.id);save();closeSheet();render();} return; }
}
function pld(t){
  const k=t.dataset.pl,row=t.closest('[data-i]'),i=row?+row.dataset.i:0,b=$('#shBody');
  const rd=()=>{ const n=b.querySelector('[data-pl="name"]'); if(n)ED.name=n.value;
    b.querySelectorAll('[data-pl="dlabel"]').forEach((el,x)=>{if(ED.days[x])ED.days[x].label=el.value;});
    b.querySelectorAll('[data-pl="dmenu"]').forEach((el,x)=>{if(ED.days[x])ED.days[x].menuId=el.value;});
    b.querySelectorAll('[data-pl="wlabel"]').forEach((el,x)=>{if(ED.weeks[x])ED.weeks[x].label=el.value;});
    b.querySelectorAll('[data-pl="wscale"]').forEach((el,x)=>{if(ED.weeks[x])ED.weeks[x].scale=+el.value||100;});
    const cw=b.querySelector('[data-pl="curw"]'),cd=b.querySelector('[data-pl="curd"]');
    if(cw)ED.curW=+cw.value||0; if(cd)ED.curD=+cd.value||0; };
  rd();
  if(k==='addday'){ ED.days.push({label:'Day'+(ED.days.length+1),menuId:S.menus[0]?S.menus[0].id:''});drawPlan();return; }
  if(k==='rmday'){ if(ED.days.length<2){toast('最低1日は必要です');return;} ED.days.splice(i,1);ED.curD=0;drawPlan();return; }
  if(k==='addweek'){ ED.weeks.push({label:(ED.weeks.length+1)+'週目',scale:100,deload:false});
    if(ED.weeks.length===2)ED.weeks[0].label='1週目'; drawPlan();return; }
  if(k==='rmweek'){ if(ED.weeks.length<2)return; ED.weeks.splice(i,1);ED.curW=0;drawPlan();return; }
  if(k==='tpl4'){ ED.weeks=[{label:'1週目',scale:100},{label:'2週目',scale:102.5},{label:'3週目',scale:105},{label:'デロード',scale:85,deload:true}];
    ED.curW=0;drawPlan();return; }
  if(k==='wn'){ const w=ED.weeks[i]; w.scale=Math.max(50,(+w.scale||100)+(+t.dataset.v)); drawPlan();return; }
  if(k==='save'){ if(!ED.name)ED.name='無題のプラン';
    const nw=ED._new;delete ED._new;
    if(nw)S.plans.push(ED); else S.plans=S.plans.map(p=>p.id===ED.id?ED:p);
    save();closeSheet();TAB='build';render();toast('保存しました');return; }
  if(k==='del'){ if(confirm('このプランを削除しますか？')){S.plans=S.plans.filter(p=>p.id!==ED.id);save();closeSheet();render();} return; }
}
document.addEventListener('input',ev=>{
  const el=ev.target;
  const st=el.closest('.st');
  if(st&&S.active){ S.active.items[+st.dataset.i].sets[+st.dataset.j][el.dataset.f]=el.value;save();return; }
  if(el.id==='fxKgI'){ paintFX();return; }
  if(el.dataset.rm){ S.oneRM[el.dataset.rm]=+el.value||0;save();return; }
  if(el.dataset.preset!=null){ S.settings.presets[+el.dataset.preset]=parseTimeText(el.value);save();return; }
  if(el.dataset.cfg){ const c=el.dataset.cfg;
    S.settings[c]=(c==='scName'||c==='scAfter')?el.value:(+el.value||(c==='round'?2.5:0));save();return; }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&T.h)tick(); });

/* 起動 */
load(); TAB='today'; render();
if(!S.tour&&!S.menus.length&&!S.logs.length) setTimeout(tour,400);
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
