<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RACK">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>RACK — 自分で組む筋トレログ</title>
<style>
:root{
  --ink:#000; --paper:#fff; --field:#F0F1F3; --line:#D9DBDF; --mute:#6B6F76;
  --red:#D50032; --blue:#0047AB; --yellow:#F2C200; --green:#00863F;
  --pad:16px; --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:calc(64px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) 10px;display:flex;align-items:baseline;gap:10px}
.brand{font-weight:900;font-size:20px;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--red)}
.hdate{margin-left:auto;font-size:12px;color:var(--mute)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--paper);border-top:2px solid var(--ink);padding-bottom:var(--safe-b)}
nav button{padding:9px 0 8px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:17px;font-weight:800;letter-spacing:-.02em}
nav button.on{color:var(--ink)}
nav button.on b{color:var(--red)}

main{padding:var(--pad) var(--pad) 24px;max-width:680px;margin:0 auto}
h2{font-size:13px;font-weight:700;margin:22px 0 8px;color:var(--mute)}
h2:first-child{margin-top:4px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:10px;overflow:hidden}
.card.hero{border:2px solid var(--ink)}
.card .top{padding:12px 14px;display:flex;align-items:center;gap:10px}
.card .top .ttl{font-weight:800;font-size:16px;letter-spacing:-.01em}
.card .top .sub{font-size:12px;color:var(--mute)}
.body{padding:0 14px 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);
  border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--paper)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--mute);font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)}
.small{font-size:12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--mute);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--field);border:1px solid transparent;border-radius:8px;padding:9px 10px;
  font-size:16px;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--paper)}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}

/* session */
.exblk{border-top:1px solid var(--line)}
.exblk:first-child{border-top:0}
.exhd{display:flex;align-items:center;gap:8px;padding:11px 14px 6px}
.exhd .nm{font-weight:800;font-size:15px}
.exhd .tag{font-size:11px;color:var(--mute);margin-left:auto}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 58px 38px;gap:6px;align-items:center;padding:4px 14px 6px}
.setrow .idx{font-size:12px;color:var(--mute);font-weight:700}
.setrow input{padding:8px 8px;text-align:center;font-weight:700}
.setrow .chk{width:38px;height:36px;border:1.5px solid var(--line);border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--line)}
.setrow.done .chk{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.setrow.done input{opacity:.55}
.sethead{display:grid;grid-template-columns:26px 1fr 1fr 58px 38px;gap:6px;padding:0 14px;font-size:10px;color:var(--mute)}
.hint{padding:0 14px 8px;font-size:11px;color:var(--mute)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mute)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.dl{border-style:dashed}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:45;display:none;
  background:var(--ink);color:var(--paper);padding:9px 14px;align-items:center;gap:12px}
#timer.on{display:flex}
#timer .t{font-size:26px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:78px}
#timer button{color:var(--paper);border:1.5px solid rgba(255,255,255,.4);border-radius:7px;padding:5px 9px;font-size:13px;font-weight:700}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red);transition:width .3s linear}

/* focus */
#focus{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px calc(var(--safe-b) + 14px)}
#focus.on{display:flex}
#focus .fx-top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
#focus .fx-ex{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:14px;line-height:1.15}
#focus .fx-set{font-size:13px;color:var(--mute);margin-top:2px}
#focus .fx-kg{font-size:84px;font-weight:900;letter-spacing:-.06em;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
#focus .fx-kg small{font-size:24px;font-weight:800;letter-spacing:0;margin-left:4px}
#focus .fx-target{font-size:17px;font-weight:700;margin-top:6px}
#focus .fx-target span{color:var(--red)}
.plates{display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:14px}
.plate{width:13px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.plates .barline{flex:0 0 22px;height:5px;background:#9AA0A6;align-self:center;border-radius:2px}
.plates .txt{font-size:11px;color:var(--mute);align-self:center;margin-left:6px}
#focus .fx-in{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
#focus .fx-in label{font-size:11px;color:var(--mute)}
#focus .fx-in input{text-align:center;font-weight:800;font-size:20px;padding:10px 4px}
#focus .fx-btn{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
#focus .fx-btn .btn{padding:15px 0;font-size:16px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .inner{background:var(--paper);width:100%;max-height:92vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;max-width:680px;margin:0 auto}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet .sh b{font-size:16px;font-weight:800;flex:1}
#sheet .sc{overflow:auto;padding:14px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* list item */
.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.li .nm{font-weight:700}
.li .mt{font-size:12px;color:var(--mute)}
.li .go{margin-left:auto;color:var(--mute);font-size:18px}

table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td{padding:3px 0;border-bottom:1px solid var(--field)}
table.log td:last-child{text-align:right;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:80;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">RACK<em>.</em></div>
  <div class="hdate" id="hdate"></div>
</header>

<main id="main"></main>

<div id="timer">
  <div class="t num" id="tval">0:00</div>
  <button id="tminus">−30</button>
  <button id="tplus">+30</button>
  <div class="grow"></div>
  <button id="tstop">終了</button>
  <div class="bar" id="tbar"></div>
</div>

<nav>
  <button data-tab="today" class="on"><b>今日</b><span>セッション</span></button>
  <button data-tab="build"><b>組む</b><span>メニュー</span></button>
  <button data-tab="log"><b>記録</b><span>履歴</span></button>
  <button data-tab="set"><b>設定</b><span>1RM・データ</span></button>
</nav>

<div id="focus">
  <div class="fx-top"><button id="fxClose" class="btn sm ghost">閉じる</button><span id="fxProg"></span></div>
  <div class="fx-ex" id="fxEx"></div>
  <div class="fx-set" id="fxSet"></div>
  <div class="fx-kg num" id="fxKg">—<small>kg</small></div>
  <div class="fx-target" id="fxTarget"></div>
  <div class="plates" id="fxPlates"></div>
  <div class="fx-in">
    <div><label>重量 kg</label><input type="number" inputmode="decimal" id="fxIkg" step="0.5"></div>
    <div><label>回数</label><input type="number" inputmode="numeric" id="fxIrep"></div>
    <div><label>RPE</label><input type="number" inputmode="decimal" id="fxIrpe" step="0.5"></div>
  </div>
  <div class="fx-btn">
    <button class="btn" id="fxSkip">スキップ</button>
    <button class="btn red" id="fxDone">このセットを記録</button>
  </div>
</div>

<div id="sheet"><div class="inner"><div class="sh"><b id="shTtl"></b><button class="btn sm ghost" id="shClose">閉じる</button></div><div class="sc" id="shBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ RPE chart: % of 1RM by reps x RPE ============ */
const RPE = {
 10:[100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0],
 9.5:[97.8,94.3,91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7],
 9:[95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3],
 8.5:[94.3,91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0],
 8:[92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6],
 7.5:[91.1,88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0,61.3],
 7:[89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6,59.9],
 6.5:[88.1,85.1,82.4,79.9,77.4,75.1,72.3,69.4,66.7,64.0,61.3,58.6],
 6:[86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0,65.3,62.6,59.9,57.2]
};
function rpePct(reps,rpe){
  const r=Math.min(12,Math.max(1,Math.round(reps||1)));
  const keys=Object.keys(RPE).map(Number).sort((a,b)=>a-b);
  let k=keys[keys.length-1];
  for(const x of keys){ if(rpe<=x){k=x;break;} }
  if(rpe<6)k=6;
  return RPE[k][r-1];
}
function e1rm(kg,reps,rpe){ if(!kg||!reps)return 0; const p=rpePct(reps,rpe||10); return kg/(p/100); }

/* ============ storage ============ */
const KEY='rack.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function defaultDB(){
  const mk=(n,big,rest)=>({id:uid(),name:n,big3:!!big,rest:rest||180,bar:true});
  const ex=[mk('スクワット',1,240),mk('ベンチプレス',1,240),mk('デッドリフト',1,300),
    mk('インクラインダンベルプレス',0,120),mk('ベントオーバーロウ',0,150),mk('ラットプルダウン',0,120),
    mk('オーバーヘッドプレス',0,150),mk('レッグプレス',0,150),mk('ケーブルロウ',0,120),
    mk('トライセプスプレスダウン',0,90),mk('フェイスプル',0,90),mk('レッグカール',0,90)];
  ex[3].bar=false;ex[5].bar=false;ex[7].bar=false;ex[8].bar=false;ex[9].bar=false;ex[10].bar=false;ex[11].bar=false;
  return {v:1,settings:{bar:20,round:2.5,rest:180,sound:true,vibe:true},
    oneRM:{[ex[0].id]:130,[ex[1].id]:105,[ex[2].id]:160},
    exercises:ex,menus:[],routines:[],programs:[],logs:[],active:null,tab:'today'};
}
let DB;
function load(){ try{ DB=JSON.parse(localStorage.getItem(KEY))||defaultDB(); }catch(e){ DB=defaultDB(); }
  for(const k of ['exercises','menus','routines','programs','logs']) if(!Array.isArray(DB[k]))DB[k]=[];
  if(!DB.settings)DB.settings=defaultDB().settings; if(!DB.oneRM)DB.oneRM={};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('保存できません（容量超過）');} }
const ex=id=>DB.exercises.find(e=>e.id===id)||{name:'不明な種目',rest:180,bar:true};
const menu=id=>DB.menus.find(m=>m.id===id);

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600);}
function roundKg(k){const r=DB.settings.round||2.5;return Math.max(0,Math.round(k/r)*r);}
function fmt(n){return (Math.round(n*100)/100).toString();}

/* 基準 1RM: 直近ログの最大e1RM（60日以内）→ なければ手動1RM */
function baseRM(exId){
  const lim=Date.now()-60*864e5; let best=0;
  for(const lg of DB.logs){ if(new Date(lg.date).getTime()<lim)continue;
    for(const it of lg.items){ if(it.exId!==exId)continue;
      for(const s of it.sets){ if(s.done&&s.kg&&s.reps){ best=Math.max(best,e1rm(s.kg,s.reps,s.rpe||10)); } } } }
  const man=DB.oneRM[exId]||0;
  return best||man;
}
/* セット定義 → 推奨重量 */
function targetKg(set,exId,scale){
  const sc=(scale==null?100:scale)/100;
  if(set.mode==='kg') return set.kg?roundKg(set.kg*sc):0;
  const b=baseRM(exId); if(!b)return 0;
  if(set.mode==='pct') return roundKg(b*(set.pct||0)/100*sc);
  return roundKg(b*rpePct(set.reps,set.rpe||8)/100*sc);
}
function setLabel(s){
  if(s.mode==='kg')return (s.kg?s.kg+'kg':'重量未設定')+' × '+(s.reps||'?');
  if(s.mode==='pct')return (s.pct||0)+'% × '+(s.reps||'?');
  return 'RPE'+(s.rpe||8)+' × '+(s.reps||'?');
}

/* ============ render ============ */
function render(){
  $('#hdate').textContent=new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===DB.tab));
  const m=$('#main');
  if(DB.tab==='today')m.innerHTML=viewToday();
  else if(DB.tab==='build')m.innerHTML=viewBuild();
  else if(DB.tab==='log')m.innerHTML=viewLog();
  else m.innerHTML=viewSet();
  window.scrollTo(0,0);
}

/* ---------- TODAY ---------- */
function viewToday(){
  if(DB.active) return sessionHTML();
  let h='<div class="card hero"><div class="top"><div><div class="ttl">今日はまだ始めていません</div>'+
    '<div class="sub">メニューを選んでセッションを開始</div></div></div>'+
    '<div class="body"><button class="btn fill wide" data-act="pick">メニューを選ぶ</button></div></div>';
  // program / routine quick start
  DB.programs.forEach(p=>{
    const w=p.weeks[p.curW||0]; if(!w)return; const d=w.days[p.curD||0]; if(!d)return; const mm=menu(d.menuId);
    h+='<div class="card"><div class="top"><div><div class="ttl">'+esc(p.name)+'</div><div class="sub">'+
      esc(w.label)+' / '+esc(d.label)+(w.deload?'・デロード':'')+(w.scale&&w.scale!==100?'・'+w.scale+'%':'')+
      ' — '+esc(mm?mm.name:'メニュー未設定')+'</div></div></div>'+
      '<div class="body"><button class="btn wide" data-act="startprog" data-id="'+p.id+'">この日を開始</button></div></div>';
  });
  DB.routines.forEach(r=>{
    const d=r.days[r.cursor||0]; if(!d)return; const mm=menu(d.menuId);
    h+='<div class="card"><div class="top"><div><div class="ttl">'+esc(r.name)+'</div><div class="sub">次は '+
      esc(d.label)+' — '+esc(mm?mm.name:'メニュー未設定')+'</div></div></div>'+
      '<div class="body"><button class="btn wide" data-act="startrout" data-id="'+r.id+'">この日を開始</button></div></div>';
  });
  if(!DB.menus.length) h+='<div class="empty"><b>まだメニューがありません</b>「組む」タブでメニューを作ると、ここから開始できます。</div>';
  h+='<h2>直近の記録</h2>'+recentHTML(3);
  return h;
}
function sessionHTML(){
  const a=DB.active;
  let total=0,done=0,vol=0;
  a.items.forEach(it=>it.sets.forEach(s=>{total++;if(s.done){done++;vol+=(s.kg||0)*(s.reps||0);}}));
  let h='<div class="card hero"><div class="top"><div class="grow"><div class="ttl">'+esc(a.title)+'</div>'+
    '<div class="sub">'+done+' / '+total+' セット完了・ボリューム '+Math.round(vol)+'kg</div></div></div>'+
    '<div class="body"><div class="row"><button class="btn red grow" data-act="focus">ジムフォーカス</button>'+
    '<button class="btn grow" data-act="finish">記録して終了</button></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="addex">種目を追加</button>'+
    '<button class="btn ghost sm" data-act="cancel">セッションを破棄</button></div></div></div>';
  a.items.forEach((it,i)=>{
    const e=ex(it.exId);
    h+='<div class="card"><div class="exblk"><div class="exhd"><div class="nm">'+esc(e.name)+'</div>'+
      '<div class="tag">'+(baseRM(it.exId)?'基準 '+fmt(roundKg(baseRM(it.exId)))+'kg':'基準なし')+'</div></div>'+
      '<div class="sethead"><span></span><span>重量 kg</span><span>回数</span><span>RPE</span><span></span></div>';
    it.sets.forEach((s,j)=>{
      h+='<div class="setrow'+(s.done?' done':'')+'" data-i="'+i+'" data-j="'+j+'">'+
        '<div class="idx num">'+(j+1)+'</div>'+
        '<input type="number" inputmode="decimal" step="0.5" class="num" data-f="kg" value="'+(s.kg||'')+'" placeholder="'+(s.tkg||'')+'">'+
        '<input type="number" inputmode="numeric" class="num" data-f="reps" value="'+(s.reps||'')+'" placeholder="'+(s.treps||'')+'">'+
        '<input type="number" inputmode="decimal" step="0.5" class="num" data-f="rpe" value="'+(s.rpe||'')+'" placeholder="'+(s.trpe||'')+'">'+
        '<button class="chk" data-act="chk">✓</button></div>';
    });
    h+='<div class="hint">目標: '+it.sets.map(s=>esc(s.label)).join(' / ')+'</div>';
    h+='<div class="row" style="padding:0 14px 12px"><button class="btn ghost sm" data-act="addset" data-i="'+i+'">セット追加</button>'+

function chartSVG(exId){
  const pts=[];
  DB.logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    let best=0; l.items.filter(i=>i.exId===exId).forEach(i=>i.sets.forEach(s=>{if(s.done&&s.kg&&s.reps)best=Math.max(best,e1rm(s.kg,s.reps,s.rpe||10));}));
    if(best)pts.push({d:l.date,v:best});
  });
  if(pts.length<1)return '<div class="mute small">この種目の記録はまだありません。</div>';
  const W=320,H=140,P=24;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs)*0.96,mx=Math.max(...vs)*1.04,rg=(mx-mn)||1;
  const X=i=>pts.length===1?W/2:P+i*(W-P*2)/(pts.length-1);
  const Y=v=>H-P-(v-mn)/rg*(H-P*2);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="#D50032"/>').join('');
  const last=pts[pts.length-1],first=pts[0];
  return '<div class="row" style="align-items:baseline;gap:8px"><div class="num" style="font-size:32px;font-weight:900;letter-spacing:-.04em">'+
    fmt(Math.round(last.v*10)/10)+'<span style="font-size:14px"> kg</span></div><div class="small mute">推定1RM・'+
    (pts.length>1?(last.v>=first.v?'+':'')+fmt(Math.round((last.v-first.v)*10)/10)+'kg':'初回')+'</div></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:4px" preserveAspectRatio="none">'+
    '<path d="'+line+'" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>'+
    '<div class="row small mute"><span>'+first.d.slice(5)+'</span><div class="grow"></div><span>'+last.d.slice(5)+'</span></div>';
}

/* ============ session engine ============ */
function buildSession(menuObj,scale,title,source){
  const items=menuObj.items.map(it=>({exId:it.exId,rest:it.rest||ex(it.exId).rest||DB.settings.rest,
    sets:it.sets.map(s=>{
      const tk=targetKg(s,it.exId,scale);
      return {kg:tk||'',reps:s.reps||'',rpe:'',tkg:tk||'',treps:s.reps||'',trpe:s.mode==='rpe'?(s.rpe||''):'',
        done:false,label:setLabel(s)};
    })}));
  DB.active={date:todayStr(),title:title,source:source||null,items:items};
  save();
}
function finishSession(){
  const a=DB.active;
  const items=a.items.map(it=>({exId:it.exId,name:ex(it.exId).name,sets:it.sets.filter(s=>s.done).map(s=>({kg:+s.kg||0,reps:+s.reps||0,rpe:+s.rpe||0,done:true}))}))
    .filter(i=>i.sets.length);
  if(!items.length){ if(!confirm('完了したセットがありません。破棄しますか？'))return; DB.active=null;save();render();return; }
  let vol=0; items.forEach(i=>i.sets.forEach(s=>vol+=s.kg*s.reps));
  DB.logs.push({id:uid(),date:a.date,title:a.title,items:items,volume:vol});
  // advance cursor
  const src=a.source;
  if(src&&src.type==='routine'){ const r=DB.routines.find(x=>x.id===src.id); if(r)r.cursor=((r.cursor||0)+1)%r.days.length; }
  if(src&&src.type==='program'){ const p=DB.programs.find(x=>x.id===src.id);
    if(p){ let w=p.curW||0,d=(p.curD||0)+1;
      if(d>=(p.weeks[w]?p.weeks[w].days.length:0)){ d=0; w=Math.min(w+1,p.weeks.length-1); }
      p.curW=w;p.curD=d; } }
  DB.active=null;save();toast('記録しました');DB.tab='log';render();
}

/* ============ timer ============ */
let T={end:0,total:0,h:null};
function startTimer(sec){
  T.end=Date.now()+sec*1000;T.total=sec;$('#timer').classList.add('on');
  clearInterval(T.h);T.h=setInterval(tick,200);tick();
}
function stopTimer(){clearInterval(T.h);T.h=null;$('#timer').classList.remove('on');}
function tick(){
  const left=Math.max(0,Math.round((T.end-Date.now())/1000));
  $('#tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#tbar').style.width=(T.total?(1-left/T.total)*100:0)+'%';
  if(left<=0){ stopTimer(); alarm(); }
}
let AC=null;
function beep(f,t,d){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(0.35,AC.currentTime+t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+t+d);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+0.02); }
function alarm(){
  if(DB.settings.sound){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); beep(880,0,.12);beep(880,.18,.12);beep(1320,.36,.35); }catch(e){} }
  if(DB.settings.vibe&&navigator.vibrate)navigator.vibrate([200,90,200,90,400]);
  toast('休憩終了');
}
function audioUnlock(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }

/* ============ focus mode ============ */
let FX={i:0,j:0};
function openFocus(){
  if(!DB.active)return;
  const p=nextUndone(0,-1); if(!p){toast('全セット完了しています');return;}
  FX=p;$('#focus').classList.add('on');drawFocus();
}
function nextUndone(i,j){
  const a=DB.active;
  for(let x=i;x<a.items.length;x++){ for(let y=(x===i?j+1:0);y<a.items[x].sets.length;y++){ if(!a.items[x].sets[y].done)return{i:x,j:y}; } }
  return null;
}
function drawFocus(){
  const a=DB.active,it=a.items[FX.i],s=it.sets[FX.j],e=ex(it.exId);
  let n=0,d=0;a.items.forEach(x=>x.sets.forEach(y=>{n++;if(y.done)d++;}));
  $('#fxProg').textContent=esc(a.title)+' — '+d+'/'+n+' セット';
  $('#fxEx').textContent=e.name;
  $('#fxSet').textContent='セット '+(FX.j+1)+' / '+it.sets.length+'　目標 '+s.label;
  const kg=+s.kg||+s.tkg||0;
  $('#fxKg').innerHTML=(kg?fmt(kg):'—')+'<small>kg</small>';
  $('#fxTarget').innerHTML=s.treps?('<span>'+s.treps+'</span> 回'+(s.trpe?' / RPE '+s.trpe:'')):'';
  $('#fxPlates').innerHTML=e.bar?plateHTML(kg):'';
  $('#fxIkg').value=s.kg||s.tkg||'';$('#fxIrep').value=s.reps||s.treps||'';$('#fxIrpe').value=s.rpe||'';
}
const PLATES=[[25,'#D50032'],[20,'#0047AB'],[15,'#F2C200'],[10,'#00863F'],[5,'#FFFFFF'],[2.5,'#111111'],[1.25,'#B9BEC4']];
function plateHTML(kg){
  const bar=DB.settings.bar||20; if(!kg||kg<=bar)return '<div class="barline"></div><span class="txt">バーのみ</span>';
  let per=(kg-bar)/2,out='',list=[];
  PLATES.forEach(([w,c])=>{ while(per>=w-0.001){ per-=w; list.push([w,c]); } });
  out='<div class="barline"></div>';
  list.forEach(([w,c])=>{ const hgt=28+w*0.72; out+='<div class="plate" style="height:'+hgt+'px;background:'+c+'"></div>'; });
  out+='<span class="txt">片側 '+list.map(x=>x[0]).join(' + ')+(per>0.01?'（+'+fmt(per)+'余り）':'')+'</span>';
  return out;
}
function focusDone(skip){
  const it=DB.active.items[FX.i],s=it.sets[FX.j];
  if(!skip){
    s.kg=+$('#fxIkg').value||s.tkg||0; s.reps=+$('#fxIrep').value||s.treps||0; s.rpe=+$('#fxIrpe').value||'';
    s.done=true; save();
    startTimer(it.rest||DB.settings.rest);
  }
  const nx=nextUndone(FX.i,FX.j);
  if(!nx){ $('#focus').classList.remove('on'); render(); toast('全セット完了'); return; }
  FX=nx;drawFocus();
}

      '<button class="btn sm ghost" data-pe="copyw" data-w="'+wi+'">この週を複製</button></div></div></div>';
  });
  h+='<button class="btn wide" style="margin-top:10px" data-pe="addw">週を追加</button>';
  h+='<label class="f">現在地</label><div class="row"><select id="pCurW" class="grow">'+
    ED.weeks.map((w,i)=>'<option value="'+i+'"'+((ED.curW||0)===i?' selected':'')+'>'+esc(w.label)+'</option>').join('')+'</select>'+
    '<select id="pCurD" class="grow">'+(ED.weeks[ED.curW||0]||{days:[]}).days.map((d,i)=>'<option value="'+i+'"'+((ED.curD||0)===i?' selected':'')+'>'+esc(d.label)+'</option>').join('')+'</select></div>';
  h+='<button class="btn wide fill" style="margin-top:12px" data-pe="save">保存</button>'+
    (ED._new?'':'<button class="btn wide ghost" style="margin-top:8px" data-pe="delall">削除</button>');
  sheet(ED._new?'プログラムを作る':'プログラムを編集',h);
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  audioUnlock();
  const nav=e.target.closest('nav button'); if(nav){DB.tab=nav.dataset.tab;save();render();return;}
  const t=e.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,i=+t.dataset.i;
  /* today */
  if(a==='pick'){
    if(!DB.menus.length){toast('先にメニューを作ってください');DB.tab='build';render();return;}
    sheet('メニューを選ぶ',DB.menus.map(m=>'<div class="li" data-act="startmenu" data-id="'+m.id+'"><div><div class="nm">'+esc(m.name)+'</div>'+
      '<div class="mt">'+m.items.length+'種目</div></div><div class="go">›</div></div>').join(''));
  }
  if(a==='startmenu'){ const m=menu(id); buildSession(m,100,m.name,null); closeSheet(); render(); }
  if(a==='startprog'){ const p=DB.programs.find(x=>x.id===id),w=p.weeks[p.curW||0],d=w.days[p.curD||0],m=menu(d.menuId);
    if(!m){toast('この日にメニューが設定されていません');return;}
    buildSession(m,w.deload?Math.min(w.scale||100,90):(w.scale||100),p.name+' '+w.label+' '+d.label,{type:'program',id:p.id});render(); }
  if(a==='startrout'){ const r=DB.routines.find(x=>x.id===id),d=r.days[r.cursor||0],m=menu(d.menuId);
    if(!m){toast('この日にメニューが設定されていません');return;}
    buildSession(m,100,r.name+' '+d.label,{type:'routine',id:r.id});render(); }
  if(a==='chk'){ const row=t.closest('.setrow'),s=DB.active.items[+row.dataset.i].sets[+row.dataset.j];
    s.done=!s.done;
    if(s.done){ const inp=row.querySelectorAll('input');
      s.kg=+inp[0].value||+s.tkg||0; s.reps=+inp[1].value||+s.treps||0; s.rpe=+inp[2].value||'';
      startTimer(DB.active.items[+row.dataset.i].rest||DB.settings.rest); }
    save();render(); }
  if(a==='addset'){ const it=DB.active.items[i],last=it.sets[it.sets.length-1]||{};
    it.sets.push({kg:last.kg||'',reps:last.reps||'',rpe:'',tkg:last.tkg||'',treps:last.treps||'',trpe:last.trpe||'',done:false,label:last.label||'追加セット'});save();render(); }
  if(a==='delex'&&DB.active){ DB.active.items.splice(i,1);save();render(); }
  if(a==='addex'&&DB.active){ pickExercise(exId=>{ DB.active.items.push({exId:exId,rest:ex(exId).rest||DB.settings.rest,
      sets:[{kg:'',reps:'',rpe:'',tkg:'',treps:'',trpe:'',done:false,label:'自由'}]});save();render(); }); }
  if(a==='focus'){ openFocus(); }
  if(a==='finish'){ finishSession(); }
  if(a==='cancel'){ if(confirm('このセッションを破棄しますか？')){DB.active=null;save();render();} }
  if(a==='openlog'){ const l=DB.logs.find(x=>x.id===id);
    sheet(l.title,'<div class="small mute">'+l.date+'</div>'+l.items.map(it=>'<h2>'+esc(it.name)+'</h2><table class="log">'+
      it.sets.map((s,n)=>'<tr><td>'+(n+1)+'</td><td>'+fmt(s.kg)+'kg × '+s.reps+(s.rpe?' @'+s.rpe:'')+'</td><td>'+
      fmt(Math.round(e1rm(s.kg,s.reps,s.rpe||10)*10)/10)+'kg</td></tr>').join('')+'</table>').join('')+
      '<button class="btn wide ghost" style="margin-top:16px" data-act="dellog" data-id="'+l.id+'">この記録を削除</button>'); }
  if(a==='dellog'){ if(confirm('削除しますか？')){DB.logs=DB.logs.filter(x=>x.id!==id);save();closeSheet();render();} }
  if(a==='chart'){ DB.chartEx=id;save();render(); }
  /* build */
  if(a==='newmenu')editMenu(null);
  if(a==='editmenu')editMenu(id);
  if(a==='newrout'){ if(!DB.menus.length){toast('先にメニューを作ってください');return;} editRoutine(null); }
  if(a==='editrout')editRoutine(id);
  if(a==='newprog'){ if(!DB.menus.length){toast('先にメニューを作ってください');return;} editProgram(null); }
  if(a==='editprog')editProgram(id);
  /* settings */
  if(a==='rmall'){ sheet('基準1RM',DB.exercises.map(e=>'<label class="f">'+esc(e.name)+'</label>'+
    '<input type="number" step="2.5" data-rm="'+e.id+'" value="'+(DB.oneRM[e.id]||'')+'">').join('')); }
  if(a==='newex'||a==='editex'){
    const e=id?DB.exercises.find(x=>x.id===id):{id:uid(),name:'',rest:DB.settings.rest,bar:true,big3:false,_new:true};
    sheet(id?'種目を編集':'種目を追加',
      '<label class="f">種目名</label><input type="text" id="exN" value="'+esc(e.name)+'">'+
      '<label class="f">休憩 秒</label><input type="number" id="exR" value="'+e.rest+'">'+
      '<label class="f"><input type="checkbox" id="exB" '+(e.bar?'checked':'')+' style="width:auto"> バーベル種目（プレート計算する）</label>'+
      '<label class="f"><input type="checkbox" id="exG" '+(e.big3?'checked':'')+' style="width:auto"> BIG3として扱う</label>'+
      '<button class="btn wide fill" style="margin-top:14px" id="exS">保存</button>'+
      (id?'<button class="btn wide ghost" style="margin-top:8px" id="exD">削除</button>':''),()=>{
        $('#exS').onclick=()=>{ e.name=$('#exN').value.trim()||'無名の種目';e.rest=+$('#exR').value||180;
          e.bar=$('#exB').checked;e.big3=$('#exG').checked;
          if(e._new){delete e._new;DB.exercises.push(e);} save();closeSheet();render(); };
        if(id)$('#exD').onclick=()=>{ if(confirm('削除しますか？（過去の記録は残ります）')){DB.exercises=DB.exercises.filter(x=>x.id!==id);save();closeSheet();render();} };
      });
  }
  if(a==='export'){ const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='rack-backup-'+todayStr()+'.json';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000); toast('書き出しました'); }
  if(a==='import'){ const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=()=>{ const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.exercises)throw 0;
        if(confirm('現在のデータを置き換えます。よろしいですか？')){DB=d;save();render();toast('読み込みました');} }catch(e){toast('読み込めませんでした');} };
      r.readAsText(f); }; inp.click(); }
  if(a==='wipe'){ if(confirm('全データを削除します。取り消せません。')&&confirm('本当に削除しますか？')){localStorage.removeItem(KEY);load();render();toast('削除しました');} }
});

/* session inputs */
document.addEventListener('input',e=>{
  const row=e.target.closest('.setrow');
  if(row&&DB.active){ const s=DB.active.items[+row.dataset.i].sets[+row.dataset.j];
    s[e.target.dataset.f]=e.target.value; save(); return; }
  const rm=e.target.dataset.rm; if(rm){ DB.oneRM[rm]=+e.target.value||0;save();return; }
  const cfg=e.target.dataset.cfg; if(cfg){
    DB.settings[cfg]=e.target.type==='checkbox'?e.target.checked:(cfg==='round'?+e.target.value:+e.target.value||0);save();return; }
});

/* menu editor events */
$('#shBody').addEventListener('click',e=>{
  const t=e.target.closest('[data-me]'); if(t)handleMenuEd(t,e);
  const r=e.target.closest('[data-re]'); if(r)handleRoutEd(r,e);
  const p=e.target.closest('[data-pe]'); if(p)handleProgEd(p,e);
});
$('#shBody').addEventListener('change',e=>{
  const t=e.target.closest('[data-me]'); if(t&&(t.dataset.me==='mode'||t.dataset.me==='val'||t.dataset.me==='reps'))handleMenuEd(t,e);
  const r=e.target.closest('[data-re]'); if(r)handleRoutEd(r,e);
  const p=e.target.closest('[data-pe]'); if(p)handleProgEd(p,e);
});
function readMenuName(){ const n=$('#mName'); if(n)ED.name=n.value; }
function handleMenuEd(t,e){
  const k=t.dataset.me;const row=t.closest('[data-i]');
  const i=row?+row.dataset.i:+t.dataset.i, j=row&&row.dataset.j!=null?+row.dataset.j:null;
  readMenuName();
  if(k==='addex'){ pickExercise(exId=>{ ED.items.push({exId:exId,rest:ex(exId).rest,
      sets:[{mode:'rpe',reps:5,rpe:8}]}); drawMenuEditor(); }); return; }
  if(k==='delex'){ ED.items.splice(i,1);drawMenuEditor();return; }
  if(k==='addset'){ const it=ED.items[i];it.sets.push(JSON.parse(JSON.stringify(it.sets[it.sets.length-1]||{mode:'rpe',reps:5,rpe:8})));drawMenuEditor();return; }
  if(k==='dup'){ const it=ED.items[i];const l=it.sets[it.sets.length-1];if(l)it.sets.push(JSON.parse(JSON.stringify(l)));drawMenuEditor();return; }
  if(k==='delset'){ ED.items[i].sets.splice(j,1);drawMenuEditor();return; }
  if(k==='mode'){ const s=ED.items[i].sets[j];s.mode=t.value;drawMenuEditor();return; }
  if(k==='val'){ const s=ED.items[i].sets[j],v=+t.value||0;
    if(s.mode==='kg')s.kg=v;else if(s.mode==='pct')s.pct=v;else s.rpe=v;return; }
  if(k==='reps'){ ED.items[i].sets[j].reps=+t.value||0;return; }
  if(k==='save'){
    if(!ED.name)ED.name='無題のメニュー';
    if(!ED.items.length){toast('種目を追加してください');return;}
    ED.items.forEach(it=>it.sets.forEach(s=>{if(!s.mode)s.mode='rpe';}));
    const nw=ED._new;delete ED._new;
    if(nw)DB.menus.push(ED); else DB.menus=DB.menus.map(m=>m.id===ED.id?ED:m);
    save();closeSheet();render();toast('保存しました');return; }
  if(k==='del'){ if(confirm('このメニューを削除しますか？')){DB.menus=DB.menus.filter(m=>m.id!==ED.id);save();closeSheet();render();} }
}
function handleRoutEd(t,e){
  const k=t.dataset.re,row=t.closest('[data-i]'),i=row?+row.dataset.i:0;
  const n=$('#rName');if(n)ED.name=n.value;
  const c=$('#rCur');if(c)ED.cursor=+c.value||0;
  if(k==='add'){ ED.days.push({label:'Day'+(ED.days.length+1),menuId:DB.menus[0]?DB.menus[0].id:''});drawRoutine();return; }
  if(k==='del'){ ED.days.splice(i,1);if(ED.cursor>=ED.days.length)ED.cursor=0;drawRoutine();return; }
  if(k==='label'){ ED.days[i].label=t.value;return; }
  if(k==='menu'){ ED.days[i].menuId=t.value;return; }
  if(k==='save'){ if(!ED.name)ED.name='無題のルーティン';
    if(!ED.days.length){toast('日を追加してください');return;}
    const nw=ED._new;delete ED._new;
    if(nw)DB.routines.push(ED); else DB.routines=DB.routines.map(r=>r.id===ED.id?ED:r);
    save();closeSheet();render();toast('保存しました');return; }
  if(k==='delall'){ if(confirm('削除しますか？')){DB.routines=DB.routines.filter(r=>r.id!==ED.id);save();closeSheet();render();} }
}
function handleProgEd(t,e){
  const k=t.dataset.pe,w=+t.dataset.w,d=+t.dataset.d;
  const n=$('#pName');if(n)ED.name=n.value;
  const cw=$('#pCurW'),cd=$('#pCurD');if(cw)ED.curW=+cw.value||0;if(cd)ED.curD=+cd.value||0;
  if(k==='wlabel'){ED.weeks[w].label=t.value;return;}
  if(k==='deload'){ED.weeks[w].deload=t.checked;return;}
  if(k==='scale'){ED.weeks[w].scale=+t.value||100;return;}
  if(k==='dlabel'){ED.weeks[w].days[d].label=t.value;return;}
  if(k==='dmenu'){ED.weeks[w].days[d].menuId=t.value;return;}
  if(k==='addd'){ED.weeks[w].days.push({label:'Day'+(ED.weeks[w].days.length+1),menuId:DB.menus[0]?DB.menus[0].id:''});drawProgram();return;}
  if(k==='deld'){ED.weeks[w].days.splice(d,1);drawProgram();return;}
  if(k==='addw'){ const last=ED.weeks[ED.weeks.length-1];
    ED.weeks.push(last?JSON.parse(JSON.stringify({...last,label:'W'+(ED.weeks.length+1),deload:false})):
      {label:'W1',deload:false,scale:100,days:[]});drawProgram();return;}
  if(k==='copyw'){ const c=JSON.parse(JSON.stringify(ED.weeks[w]));c.label='W'+(ED.weeks.length+1);ED.weeks.push(c);drawProgram();return;}
  if(k==='delw'){ if(ED.weeks.length<2){toast('最低1週は必要です');return;} ED.weeks.splice(w,1);ED.curW=0;ED.curD=0;drawProgram();return;}
  if(k==='save'){ if(!ED.name)ED.name='無題のプログラム';
    const nw=ED._new;delete ED._new;
    if(nw)DB.programs.push(ED); else DB.programs=DB.programs.map(p=>p.id===ED.id?ED:p);
    save();closeSheet();render();toast('保存しました');return; }
  if(k==='delall'){ if(confirm('削除しますか？')){DB.programs=DB.programs.filter(p=>p.id!==ED.id);save();closeSheet();render();} }
}

/* misc handlers */
$('#shClose').onclick=closeSheet;
$('#sheet').onclick=e=>{ if(e.target.id==='sheet')closeSheet(); };
$('#fxClose').onclick=()=>{$('#focus').classList.remove('on');render();};
$('#fxDone').onclick=()=>focusDone(false);
$('#fxSkip').onclick=()=>focusDone(true);
$('#fxIkg').oninput=()=>{ if(!DB.active)return; const kg=+$('#fxIkg').value||0;
  $('#fxKg').innerHTML=(kg?fmt(kg):'—')+'<small>kg</small>';
  const it=DB.active.items[FX.i]; if(it)$('#fxPlates').innerHTML=ex(it.exId).bar?plateHTML(kg):''; };
$('#tstop').onclick=stopTimer;
$('#tplus').onclick=()=>{T.end+=30000;T.total+=30;tick();};
$('#tminus').onclick=()=>{T.end-=30000;tick();};
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&T.h)tick(); });

/* boot */
load();render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
